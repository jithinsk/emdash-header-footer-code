name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the GitHub Release
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Release notes come from this version's CHANGELOG.md section; fail before publishing if it's missing.
      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; }
      # Trusted publishing (OIDC): no token; provenance is added automatically.
      - run: npm publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
